# 电场环境演示配置：全部为人工设定，用于可复现的合成仿真，不代表实测海况。
# 坐标采用 ENU；电场输入单位为 μV/m，适配层会转换为 HJC 内部的 V/m。
scenario_id=SyntheticValidationData
data_nature=SyntheticValidationData
source_description=人工设定的电场背景演示：恒定运动电场、局部场与一艘干扰船舶
source_uri=urn:seamine:electric-environment-demo
# 对应 2025-01-01 00:00:00 UTC 加当时的 37 秒 TAI-UTC 偏移。
valid_time_tai_ns=1735689637000000000
valid_duration_s=75
conductivity_s_m=4.54

# constant 表示整段时间使用同一个已求解运动电场；none 表示关闭该分量。
motional_mode=constant
motional_east_uV_m=0.006
motional_north_uV_m=-0.003
motional_up_uV_m=0.001

# 均匀局部背景场；关闭时只保留 local_field_enabled=false 一行。
local_field_enabled=true
local_east_uV_m=0.012
local_north_uV_m=0.005
local_up_uV_m=-0.004
local_lineage_id=synthetic-local-electric-grid

# 其他船舶或设备的等效电流偶极子；偶极矩为带统一初相位的 ENU 三分量。
interference_count=1
interference.0.source_id=4001
interference.0.lineage_id=synthetic-electric-interference-4001
interference.0.x_m=-180
interference.0.y_m=-120
interference.0.z_m=-8
interference.0.vx_m_s=2
interference.0.vy_m_s=0.5
interference.0.vz_m_s=0
interference.0.moment_east_a_m=1.2
interference.0.moment_north_a_m=0.25
interference.0.moment_up_a_m=-0.10
interference.0.phase_deg=20
interference.0.frequency_hz=0.4
